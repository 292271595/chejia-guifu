<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车驾管知识库 · RAG 智能问答</title>
    <style>
        :root {
            --bg-deep: #0a0e17;
            --bg-card: rgba(15, 23, 42, 0.85);
            --bg-card-hover: rgba(20, 30, 55, 0.9);
            --border-glow: rgba(56, 189, 248, 0.2);
            --border-card: rgba(56, 189, 248, 0.08);
            --accent: #38bdf8;
            --accent-2: #818cf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #f87171;
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== 网格背景动画 ===== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px),
                linear-gradient(180deg, rgba(56,189,248,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            mask: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
            -webkit-mask: radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== 扫描线 ===== */
        .scanline {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(56,189,248,0.15), transparent);
            animation: scan 6s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes scan { 0% { top: -2px; } 100% { top: 100vh; } }

        /* ===== 粒子 ===== */
        .particles {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) scale(2); opacity: 0; }
        }

        /* ===== 主容器 ===== */
        .wrapper { position: relative; z-index: 2; max-width: 880px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

        /* ===== 顶部 ===== */
        .hero {
            text-align: center;
            padding: 2.5rem 0 1.5rem;
        }
        .hero .logo {
            display: inline-flex; align-items: center; gap: 0.6rem;
            margin-bottom: 0.6rem;
        }
        .hero .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 24px var(--accent-glow);
        }
        .hero h1 {
            font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, #e2e8f0, #38bdf8, #818cf8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .hero .subtitle {
            font-size: 0.85rem; color: var(--text-dim);
            margin-top: 0.25rem;
            letter-spacing: 1px;
        }
        .hero .subtitle .dot { color: var(--success); }
        .hero .tag-row {
            display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.8rem; flex-wrap: wrap;
        }
        .hero .tag {
            font-size: 0.7rem; padding: 0.25rem 0.75rem;
            border: 1px solid rgba(56,189,248,0.2);
            border-radius: 20px; color: var(--accent);
            background: rgba(56,189,248,0.06);
            letter-spacing: 0.5px;
        }

        /* ===== 状态栏 ===== */
        .status-bar {
            display: flex; align-items: center; gap: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 0.7rem 1.2rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-size: 0.8rem;
            transition: border-color 0.3s;
        }
        .status-bar:hover { border-color: var(--border-glow); }
        .status-pulse {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-dim); flex-shrink: 0;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .status-pulse.online {
            background: var(--success);
            box-shadow: 0 0 10px rgba(52,211,153,0.6);
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow { 0%,100% { box-shadow: 0 0 6px rgba(52,211,153,0.4); } 50% { box-shadow: 0 0 16px rgba(52,211,153,0.8); } }
        .status-text { color: var(--text-muted); }
        .status-count {
            margin-left: auto; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== 问答卡片 ===== */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: border-color 0.3s, transform 0.2s;
        }
        .card:hover { border-color: var(--border-glow); }
        .card-title {
            font-size: 0.9rem; font-weight: 700; color: var(--text-muted);
            margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 1px;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .card-title::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            background: var(--accent); border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        /* ===== 输入区域 ===== */
        .input-wrap {
            position: relative;
            border: 1px solid rgba(56,189,248,0.15);
            border-radius: var(--radius-sm);
            background: rgba(15,23,42,0.6);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(56,189,248,0.1), inset 0 0 20px rgba(56,189,248,0.03);
        }
        .input-wrap textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            padding: 1rem;
            resize: vertical;
            min-height: 60px;
            max-height: 150px;
            outline: none;
            line-height: 1.6;
        }
        .input-wrap textarea::placeholder { color: var(--text-dim); }
        .input-actions {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.5rem 1rem 0.75rem;
            gap: 0.5rem;
        }
        .btn-send {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.55rem 1.6rem;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .btn-send:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
        .btn-send:active { transform: translateY(0); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-send .arrow { font-size: 1rem; transition: transform 0.2s; }
        .btn-send:hover .arrow { transform: translateX(3px); }
        .hint {
            font-size: 0.7rem; color: var(--text-dim);
        }

        /* ===== 预设问题 ===== */
        .presets { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.8rem; }
        .preset-tag {
            font-size: 0.72rem; padding: 0.3rem 0.8rem;
            border: 1px solid rgba(56,189,248,0.12);
            border-radius: 20px; color: var(--text-muted);
            background: rgba(56,189,248,0.04);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .preset-tag:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(56,189,248,0.1);
            box-shadow: 0 0 12px rgba(56,189,248,0.1);
        }

        /* ===== 回答区域 ===== */
        .answer-card {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: var(--radius);
            padding: 0;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            animation: slideUp 0.4s ease-out;
        }
        .answer-card.show { display: block; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(56,189,248,0.06);
            display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.8rem; color: var(--text-dim);
            letter-spacing: 1px;
        }
        .answer-header .ai-badge {
            background: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(129,140,248,0.15));
            color: var(--accent);
            font-size: 0.7rem; padding: 0.2rem 0.6rem;
            border-radius: 4px; font-weight: 700;
        }
        .answer-body {
            padding: 1.5rem;
            line-height: 1.85; font-size: 0.93rem;
        }
        .answer-body p { margin-bottom: 0.6rem; }
        .fact-badge {
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 0.9rem; padding: 5px 10px 5px 8px;
            border-radius: 6px;
            background: rgba(52, 211, 153, 0.10);
            border: 1px solid rgba(52, 211, 153, 0.32);
            color: var(--success);
            font-size: 0.75rem; line-height: 1.45;
            letter-spacing: 0.2px;
        }
        .answer-body strong { color: var(--accent); font-weight: 700; }
        .answer-body ul, .answer-body ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        .answer-body li { margin-bottom: 0.25rem; }
        .answer-body code {
            background: rgba(56,189,248,0.08); color: var(--accent);
            padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.88em;
        }

        /* ===== 来源 ===== */
        .sources-wrap {
            border-top: 1px solid rgba(56,189,248,0.06);
            padding: 1rem 1.5rem;
        }
        .sources-wrap h4 {
            font-size: 0.75rem; color: var(--text-dim);
            margin-bottom: 0.6rem; letter-spacing: 1px;
            text-transform: uppercase;
        }
        .source-row {
            display: flex; align-items: center; gap: 0.6rem;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            background: rgba(56,189,248,0.03);
            border: 1px solid rgba(56,189,248,0.05);
            margin-bottom: 0.35rem;
            font-size: 0.78rem;
            transition: all 0.2s;
        }
        .source-row:hover { border-color: rgba(56,189,248,0.15); background: rgba(56,189,248,0.06); }
        .source-idx {
            width: 20px; height: 20px; border-radius: 50%;
            background: rgba(56,189,248,0.12); color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; flex-shrink: 0;
        }
        .source-name { color: var(--text-muted); flex: 1; }
        .source-score {
            color: var(--success); font-weight: 700; font-size: 0.75rem; flex-shrink: 0;
        }

        /* ===== 加载动画 ===== */
        .loading-box { display: none; padding: 3rem 1.5rem; text-align: center; }
        .loading-box.show { display: block; }
        .typing-dots { display: inline-flex; gap: 6px; }
        .typing-dots span {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent);
            animation: dot-bounce 1.4s infinite ease-in-out;
        }
        .typing-dots span:nth-child(1) { animation-delay: 0s; }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dot-bounce { 0%,80%,100% { transform: scale(0.6); opacity: 0.3; } 40% { transform: scale(1.2); opacity: 1; } }
        .loading-text { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.8rem; }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            .wrapper { padding: 1rem 0.8rem 2rem; }
            .hero { padding: 1.5rem 0 1rem; }
            .hero h1 { font-size: 1.4rem; }
            .input-actions { flex-direction: column; align-items: stretch; }
            .btn-send { justify-content: center; }
            .card, .sources-wrap { padding: 1rem; }
            .answer-body { padding: 1rem; }
        }
    </style>
</head>
<body>

<!-- 扫描线 -->
<div class="scanline"></div>

<!-- 粒子背景 -->
<div class="particles" id="particles"></div>

<div class="wrapper">

    <!-- 顶部 -->
    <div class="hero">
        <div class="logo">
            <div class="logo-icon">&#x1F698;</div>
            <h1>车驾管知识库</h1>
        </div>
        <div class="subtitle">RAG 智能问答系统<span class="dot"> · </span>基于 BGE-M3 向量检索<span class="dot"> · </span>GLM-Z1-9B 生成</div>
        <div class="tag-row">
            <span class="tag">驾驶证业务</span>
            <span class="tag">机动车登记</span>
            <span class="tag">交通违法</span>
            <span class="tag">车辆标准</span>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <span class="status-pulse" id="statusPulse"></span>
        <span class="status-text" id="statusText">检测中...</span>
        <span class="status-count" id="statusCount"></span>
    </div>

    <!-- 输入区 -->
    <div class="card">
        <div class="card-title">提出问题</div>
        <div class="input-wrap">
            <textarea id="questionInput"
                      placeholder="输入你的车驾管业务问题，例如：驾驶证到期怎么换证？新车注册需要什么材料？闯红灯扣几分？"
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitQuestion();}"></textarea>
            <div class="input-actions">
                <span class="hint">Enter 发送 · Shift+Enter 换行</span>
                <button class="btn-send" id="sendBtn" onclick="submitQuestion()">
                    发送提问 <span class="arrow">&#8594;</span>
                </button>
            </div>
        </div>
        <div class="presets">
            <span class="preset-tag" onclick="quickAsk('驾驶证到期怎么换证？')">驾驶证换证</span>
            <span class="preset-tag" onclick="quickAsk('新车注册需要什么材料？')">新车注册</span>
            <span class="preset-tag" onclick="quickAsk('闯红灯扣几分罚多少钱？')">闯红灯</span>
            <span class="preset-tag" onclick="quickAsk('记满12分怎么处理？')">记满12分</span>
            <span class="preset-tag" onclick="quickAsk('70岁以上还能考C1吗？')">高龄申领</span>
            <span class="preset-tag" onclick="quickAsk('小型汽车年检周期？')">年检周期</span>
            <span class="preset-tag" onclick="quickAsk('酒驾怎么处罚？')">酒驾处罚</span>
            <span class="preset-tag" onclick="quickAsk('A1驾驶证多少岁降级？')">降级年龄</span>
        </div>
    </div>

    <!-- 回答区域 -->
    <div class="answer-card" id="answerCard">
        <div class="answer-header">
            <span class="ai-badge">AI</span>
            <span>智能回答</span>
        </div>
        <div class="loading-box" id="loadingBox">
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
            <div class="loading-text">正在检索知识库并生成回答...</div>
        </div>
        <div class="answer-body" id="answerBody"></div>
        <div class="sources-wrap" id="sourcesWrap" style="display:none;">
            <h4>引用来源</h4>
            <div id="sourcesList"></div>
        </div>
    </div>

</div>

<script>
    // ===== DOM =====
    const el = {
        input: document.getElementById('questionInput'),
        sendBtn: document.getElementById('sendBtn'),
        answerCard: document.getElementById('answerCard'),
        loadingBox: document.getElementById('loadingBox'),
        answerBody: document.getElementById('answerBody'),
        sourcesWrap: document.getElementById('sourcesWrap'),
        sourcesList: document.getElementById('sourcesList'),
        statusPulse: document.getElementById('statusPulse'),
        statusText: document.getElementById('statusText'),
        statusCount: document.getElementById('statusCount'),
    };

    // ===== 粒子背景 =====
    (function initParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.width = p.style.height = (1 + Math.random() * 2.5) + 'px';
            p.style.animationDuration = (8 + Math.random() * 14) + 's';
            p.style.animationDelay = Math.random() * 10 + 's';
            container.appendChild(p);
        }
    })();

    // ===== 状态检测 =====
    async function checkStatus() {
        try {
            const resp = await fetch('/api/status');
            const data = await resp.json();
            if (data.status === 'ready') {
                el.statusPulse.classList.add('online');
                el.statusText.textContent = '系统就绪';
                el.statusCount.textContent = `${data.document_count} 条知识`;
            } else {
                el.statusPulse.classList.remove('online');
                el.statusText.textContent = data.message || '未就绪';
                el.statusCount.textContent = '';
            }
        } catch {
            el.statusPulse.classList.remove('online');
            el.statusText.textContent = '连接失败';
            el.statusCount.textContent = '';
        }
    }

    // ===== 提交问题 =====
    async function submitQuestion() {
        const q = el.input.value.trim();
        if (!q) return;

        el.answerCard.classList.add('show');
        el.answerBody.innerHTML = '';
        el.sourcesWrap.style.display = 'none';
        el.sourcesList.innerHTML = '';
        el.loadingBox.classList.add('show');
        el.sendBtn.disabled = true;

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 90000);
        try {
            let resp = null, lastErr = null;
            // 公网隧道偶发抖动，失败自动重试一次（同一次提问，不会重复计费）
            for (let attempt = 0; attempt < 2; attempt++) {
                try {
                    resp = await fetch('/api/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: q }),
                        signal: controller.signal
                    });
                    break;
                } catch (err) {
                    lastErr = err;
                    if (attempt === 0) await new Promise(r => setTimeout(r, 1200));
                }
            }
            if (!resp) throw lastErr || new Error('网络异常');
            const data = await resp.json();

            if (data.success) {
                const badge = data.fact_hit
                    ? `<div class="fact-badge">✅ 法规查表直答 · 未经模型生成，答案取自结构化法规事实表</div>`
                    : '';
                el.answerBody.innerHTML = badge + formatAnswer(data.answer);
                if (data.sources && data.sources.length > 0) {
                    el.sourcesWrap.style.display = 'block';
                    data.sources.forEach((s, i) => {
                        const row = document.createElement('div');
                        row.className = 'source-row';
                        row.innerHTML = `
                            <span class="source-idx">${i + 1}</span>
                            <span class="source-name">${s.title || s.source} · ${sourceLabel(s.source)}</span>
                            <span class="source-score">${(s.score * 100).toFixed(0)}%</span>
                        `;
                        el.sourcesList.appendChild(row);
                    });
                }
            } else {
                el.answerBody.innerHTML = `<p style="color:var(--warning);">${data.message || '未找到相关信息'}</p>`;
            }
        } catch (e) {
            const msg = (e && e.name === 'AbortError')
                ? '等待超时（90 秒）。公网访问偶有拥堵，请再点一次发送；本机/局域网访问不受影响。'
                : '请求失败：' + (e && e.message ? e.message : '网络异常') + '。公网访问偶发断连，请重试一次。';
            el.answerBody.innerHTML = `<p style="color:var(--danger);">${msg}</p>`;
        } finally {
            clearTimeout(timer);
            el.loadingBox.classList.remove('show');
            el.sendBtn.disabled = false;
            el.input.focus();
        }
    }

    function quickAsk(q) {
        el.input.value = q;
        submitQuestion();
    }

    // ===== 格式化 =====
    function formatAnswer(text) {
        return text
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/###\s?(.+)/g, '<h3 style="font-size:1rem;color:var(--accent);margin:0.8rem 0 0.4rem;">$1</h3>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>')
            .replace(/^/, '<p>').replace(/$/, '</p>');
    }

    function sourceLabel(src) {
        const map = {
            'driving_license': '驾驶证业务',
            'vehicle_registration': '机动车登记',
            'traffic_violations': '交通违法',
